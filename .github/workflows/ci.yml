name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          include-prerelease: true

      - name: Restore
        run: dotnet restore "Test NET 10.slnx"

      - name: Build
        run: dotnet build "Test NET 10.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "Test NET 10.slnx" --configuration Release --no-build --verbosity normal
